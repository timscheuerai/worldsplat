[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worldsplat"
version = "0.1.0"
description = "Open-source text-to-3D world generation. One command, navigable Gaussian Splat scenes."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Tim Scheuer" }]
keywords = ["3d", "gaussian-splatting", "world-generation", "diffusion", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0",
    "torchvision",
    "diffusers>=0.30.1",
    "transformers>=4.44.2",
    "accelerate>=0.33.0",
    "imageio[ffmpeg]",
    "pillow",
    "numpy",
    "tqdm",
]

[project.optional-dependencies]
pose = [
    # MASt3R dependencies — installed separately via git clone
    "einops",
    "timm",
    "scipy",
]
splat = [
    "gsplat",
    "jaxtyping",
    "rich",
]
all = ["worldsplat[pose,splat]"]

[project.scripts]
worldsplat = "worldsplat.cli:main"

[project.urls]
Homepage = "https://github.com/timscheuer/worldsplat"
Issues = "https://github.com/timscheuer/worldsplat/issues"
